[theme]
base = "dark"
primaryColor = "#d1d5db"
backgroundColor = "#111214"
secondaryBackgroundColor = "#1b1d21"
textColor = "#e5e7eb"
font = "Aptos"
headingFont = "Aptos Display"
baseRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
